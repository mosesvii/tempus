  .ts-agenda-mini-cell.is-selected { background:var(--primary); border-color:var(--primary); color:var(--on-primary, #fff); }
  .ts-agenda-mini-dot { width:4px; height:4px; border-radius:50%; background:transparent; }
  /* Look-ahead second month, sharing the card and the nav arrows of the month above it. */
  .ts-agenda-mini-month2 { margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
  .ts-agenda-mini-sublabel { font-size:calc(var(--font-size-sm) - 1px); font-weight:700; color:var(--muted); text-align:center; margin-bottom:12px; font-variant-numeric:tabular-nums; }

  .ts-agenda-main { display:flex; flex-direction:column; gap:var(--space-4); }
  /* Slim header strip (not a panel): a paired ‹ › stepper anchors the left, title flows to its right
     (so a longer week label can't nudge the arrows), Today + Filter push to the far right. */
  .ts-agenda-week-bar { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
  .ts-agenda-week-head { display:flex; align-items:center; gap:14px; min-width:0; }
  .ts-agenda-week-stepper { display:flex; align-items:center; gap:4px; flex:none; }
  .ts-agenda-week-headings { min-width:0; }
  .ts-agenda-week-nav { width:30px; height:30px; min-height:0; padding:0; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .ts-agenda-week-nav svg { width:14px; height:14px; }
  .ts-agenda-week-actions { display:flex; align-items:center; gap:var(--space-2); flex:none; }
  .ts-agenda-week-actions .ghost { height:36px; min-height:0; }
  .ts-agenda-week-title { font-size:var(--font-size-lg); font-weight:700; color:var(--text); margin:0; font-variant-numeric:tabular-nums; }
  .ts-agenda-week-sub { margin:3px 0 0; }
  /* Weekly progress vs a generic 7.5h-per-workday target (weekends + public holidays excluded).
     Contractors have no fixed "expected" week, so this is a glanceable yardstick, not a hard goal. */
  .ts-agenda-week-progress { margin-top:8px; height:4px; max-width:240px; border-radius:999px; background:var(--surface-subtle); overflow:hidden; }
  .ts-agenda-week-progress-fill { display:block; height:100%; width:0; border-radius:inherit; background:var(--primary); transition:width .35s ease, background-color .2s ease; }
  .ts-agenda-week-progress-fill.is-complete { background:var(--success); }
  /* Agenda filter chips use the unified .ts-calendar-filter-item design (single source of truth). */
  .ts-agenda-dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--muted); }

  .ts-agenda-list { display:flex; flex-direction:column; gap:var(--space-3); }
  /* Strip fill is derived (panel nudged toward text) by default, but a theme can hard-code it
     by setting --agenda-row-bg / --agenda-row-empty-bg (the formula is the fallback). */
  .ts-agenda-row { display:flex; align-items:center; gap:var(--space-4); padding:var(--space-4); background:var(--agenda-row-bg, color-mix(in srgb, var(--panel) 86%, var(--text))); border:1px solid var(--border); border-radius:12px; cursor:pointer; transition:box-shadow .12s ease, border-color .12s ease; }
  /* Hover lift via an inset ring: bg/border-agnostic, so it reads cleanly over typed/sick/holiday washes
     (which set their own inline background) instead of the old brightness filter that muddied dark rows. */
  .ts-agenda-row:hover:not(.is-selected):not(.is-today) { border-color:transparent; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--text) 20%, transparent); }
  .ts-agenda-row.is-empty { background:var(--agenda-row-empty-bg, color-mix(in srgb, var(--panel) 40%, var(--bg))); }
  /* Empty days recede so logged days lead the eye (the date no longer shouts at full strength). */
  .ts-agenda-row.is-empty .ts-agenda-row-wd { color:var(--muted); }
  .ts-agenda-row.is-empty .ts-agenda-row-day { color:var(--muted); font-weight:600; }
  .ts-agenda-row.is-empty .ts-agenda-row-type { color:var(--muted); font-weight:500; }
  .ts-agenda-row.is-empty .ts-agenda-dot { opacity:.5; }
  .ts-agenda-row.is-sick { background:var(--badge-error-bg); border-color:var(--badge-error-border); }
  .ts-agenda-row.is-holiday { background:var(--holiday-bg); border-color:var(--holiday-border); }
  /* Selection swaps the resting (often near-white) border to the accent and reinforces it with an INSET
     line, so the outermost pixel is always the accent — no white hairline left hovering outside an inner
     ring (which an outer box-shadow produced against pale-bordered themes like Velvet Espresso). */
  /* Selection (the row whose editor/menu is open) = the stronger OPAQUE --primary ring, so the actively-
     edited row reads a touch stronger than today's soft persistent ring — mirrors the Calendar's today-vs-
     selected distinction. */
  .ts-agenda-row.is-selected { border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
  /* Today: tint the date block so the current day is findable at a glance, distinct from the selection ring.
     Placed after .is-empty so today still reads as "today" even before any hours are logged. */
  .ts-agenda-row.is-today .ts-agenda-row-wd,
  .ts-agenda-row.is-today .ts-agenda-row-day { color:var(--primary-soft-text); }
  /* Today keeps a persistent SOFT ring (--primary-soft-border, matching the Calendar's today cell) so the
     current day stays obvious even when no editor is open and in themes where the accent text tint sits
     close to the body text (e.g. Velvet Espresso). :not(.is-selected) so that when today IS the open day,
     the stronger opaque selection ring wins — today is the soft baseline, selection the stronger overlay. */
  .ts-agenda-row.is-today:not(.is-selected) { border-color:var(--primary-soft-border); box-shadow:inset 0 0 0 1px var(--primary-soft-border); }
  .ts-agenda-row-date { width:48px; text-align:center; flex:none; }
  .ts-agenda-row-wd { font-size:calc(var(--font-size-xs) - 1px); font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0; }
  .ts-agenda-row-day { font-size:var(--font-size-lg); font-weight:700; color:var(--text); line-height:1; margin:3px 0 0; font-variant-numeric:tabular-nums; }
  .ts-agenda-row-sep { width:1px; height:36px; background:var(--border); flex:none; }
  /* gap:var(--space-2) = the dot→title spacing (matches each extra type below); the wider primary-dot→content
     gap used to differ from the extras, so they're unified here for an even rhythm across all hour types. */
  .ts-agenda-row-main { flex:1; display:flex; align-items:center; gap:var(--space-2); min-width:0; }
  /* gap:var(--space-4) here is the between-types spacing (≈2× the dot→title gap, so each `● Name` groups). */
  .ts-agenda-row-type { font-size:var(--font-size-sm); font-weight:600; color:var(--text); margin:0; display:flex; align-items:center; gap:var(--space-4); flex-wrap:wrap; min-width:0; }
  /* Multi-type day: the other types are listed after the primary name as dot + name (muted) — the wide
     agenda row has room for it. Same-size dots, vertically centred by the flex row above (no baseline drift). */
  .ts-agenda-type-extra { display:inline-flex; align-items:center; gap:var(--space-2); font-weight:600; color:var(--text); }
  /* Same dot size + weight as the primary type — only the muted colour marks them as secondary. */
  .ts-agenda-type-extra-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .ts-agenda-row-sub { font-size:var(--font-size-xs); color:var(--muted); margin:3px 0 0; }
  .ts-agenda-row-hours { font-size:var(--font-size-lg); font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .ts-agenda-row-hours.is-muted { color:var(--muted); }
  /* "Open" shown in the hours column when a punch is in progress with no hours yet. Right-aligned in the
     hours slot like a logged day, but lighter than the bold hour NUMBERS — a bold word reads as shouting. */
  .ts-agenda-row-hours--open { color:var(--badge-warn-text); font-weight:500; font-size:var(--font-size-base); }
  .ts-agenda-row-chev { width:8px; height:12px; flex:none; color:var(--muted); }
  /* Open-punch reminder: amber pill on any day with a clocked-in, not-clocked-out punch (mirrors the calendar). */
  .ts-agenda-open-badge { flex:none; font-size:calc(var(--font-size-xs) - 2px); font-weight:600; letter-spacing:0.03em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:var(--badge-warn-bg); color:var(--badge-warn-text); white-space:nowrap; }
  .ts-agenda-row.is-open { border-color:color-mix(in srgb, var(--badge-warn-text) 45%, transparent); }
  @media (max-width: 1040px) {
    .ts-agenda-layout { grid-template-columns:1fr; }
    .ts-agenda-side, .ts-agenda-main { grid-column:auto; }
  }

  /* ---- Flatpickr theming to match Tempus (and fix the hidden year input) ---- */
  .flatpickr-calendar { background: var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow: var(--shadow-lg); }
  .flatpickr-calendar.arrowTop::before, .flatpickr-calendar.arrowTop::after { border-bottom-color: var(--panel); }
  .flatpickr-calendar.arrowBottom::before, .flatpickr-calendar.arrowBottom::after { border-top-color: var(--panel); }
  /* flatpickr's bundled CSS colours the header (month text + prev/next arrows) with TWO-class selectors
     (.flatpickr-months .flatpickr-month / .flatpickr-prev-month) using a near-black rgba(0,0,0,0.9) default.
     A bare .flatpickr-month / .flatpickr-prev-month override loses on specificity, so in dark themes that
     black leaked through — invisible arrows, and the month name dropping out. Match the two-class specificity
     and paint the svg + its <path> (default `fill:inherit`) directly so the theme --text always wins. */
  .flatpickr-months, .flatpickr-month,
  .flatpickr-months .flatpickr-month { background: transparent; color: var(--text); fill: var(--text); }
  .flatpickr-months .flatpickr-prev-month,
  .flatpickr-months .flatpickr-next-month { color: var(--text); fill: var(--text); }
  .flatpickr-months .flatpickr-prev-month svg,
  .flatpickr-months .flatpickr-next-month svg,
  .flatpickr-months .flatpickr-prev-month svg path,
  .flatpickr-months .flatpickr-next-month svg path { fill: var(--text); }
  .flatpickr-months .flatpickr-prev-month:hover svg,
  .flatpickr-months .flatpickr-next-month:hover svg,
  .flatpickr-months .flatpickr-prev-month:hover svg path,
  .flatpickr-months .flatpickr-next-month:hover svg path { fill: var(--primary); }
  /* Lay month + year on one centred row (the global select/input rules were stacking the year below) */
  .flatpickr-months .flatpickr-current-month { font-size: 15px; color: var(--text); display:flex; align-items:center; justify-content:center; gap:6px; }
  .flatpickr-months .flatpickr-current-month .flatpickr-monthDropdown-months { width:auto; display:inline-block; background:transparent; background-image:none; padding-right:0; color: var(--text); font-weight:600; }
  .flatpickr-current-month .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month { background: var(--panel); color: var(--text); }
  /* The global `input { width:100%; display:block; }` rule hid the year — reset it just for the picker */
  .flatpickr-current-month input.cur-year { width:auto; min-width:6ch; display:inline-block; background:transparent; border:none; border-radius:0; padding:0 0 0 .5ch; color: var(--text); font-weight:600; font-size:15px; }
  .flatpickr-current-month .numInputWrapper { width: 7ch; display:inline-block; vertical-align:middle; }
  .numInputWrapper span.arrowUp, .numInputWrapper span.arrowDown { border:none; }
  .numInputWrapper span.arrowUp::after { border-bottom-color: var(--muted); }
  .numInputWrapper span.arrowDown::after { border-top-color: var(--muted); }
  /* Give the weekday header row breathing room (default height squashes the enlarged type) */
  .flatpickr-weekdays { height:34px; }
  span.flatpickr-weekday { color: var(--muted); font-weight:600; height:34px; line-height:34px; }
  /* Each day fills exactly one of seven equal columns, so the grid always lines up under the weekday
     headers no matter how wide the calendar is stretched. (Capping day width at 32px let flexbox pack
     extra cells per row once the calendar was widened to the field, knocking the numbers out of line.) */
  .flatpickr-day { color: var(--text); border-radius:8px; border:1px solid transparent; height:36px; line-height:36px; margin:2px 0; flex:1 0 14.2857%; max-width:14.2857%; }
  .flatpickr-day:hover, .flatpickr-day:focus { background: color-mix(in srgb, var(--primary) 22%, var(--surface-subtle)); border-color: transparent; color: var(--text); }
  .flatpickr-day.today { border-color: var(--primary-600); }
  .flatpickr-day.today:hover { background: color-mix(in srgb, var(--primary) 22%, var(--surface-subtle)); color: var(--text); }
  .flatpickr-day.selected, .flatpickr-day.selected:hover, .flatpickr-day.selected:focus { background: var(--primary); border-color: var(--primary); color: var(--on-primary, #fff); }
  .flatpickr-day.flatpickr-disabled, .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--muted); opacity:0.5; }
  /* The calendar width is set inline (in JS) to match its field; stretch the day grid + weekday header
     to fill it so the columns spread across the field rather than sitting in flatpickr's fixed 308px box.
     Two-class selectors out-specify flatpickr's own single-class width rules. */
  .flatpickr-calendar .flatpickr-days,
  .flatpickr-calendar .flatpickr-weekdays,
  .flatpickr-calendar .flatpickr-weekdaycontainer { width:100%; }
  .flatpickr-calendar .dayContainer { width:100%; min-width:100%; max-width:100%; }

  /* ---- Hero "Add / Update Entry" buttons: theme accent gradient with subtle depth — a delicate top highlight + soft drop shadow, no gloss. Entry form only; other buttons stay flat so this keeps its hierarchy. ---- */
  #btn-add-manual, #btn-punch-save { background: linear-gradient(180deg, var(--primary), var(--primary-600)); color: var(--on-primary, #fff); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 10px var(--primary-glow), 0 1px 2px rgba(0,0,0,0.30); transition: box-shadow .15s ease, filter .15s ease, transform .08s ease; }
  #btn-add-manual:hover, #btn-punch-save:hover { background: linear-gradient(180deg, var(--primary), var(--primary-600)); filter: brightness(1.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 14px var(--primary-glow), 0 2px 4px rgba(0,0,0,0.35); transform: translateY(-1px); }
  #btn-add-manual:active, #btn-punch-save:active { background: linear-gradient(180deg, var(--primary), var(--primary-600)); filter: brightness(0.95); box-shadow: inset 0 1px 3px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.30); transform: translateY(1px) scale(0.99); }
  #btn-add-manual:disabled, #btn-punch-save:disabled { color:#fff; box-shadow:none; filter:none; transform:none; }
  /* Confirm/alert dialog's primary button matches the theme accent */
  #modal-confirm #btn-confirm-ok:not(.danger), #modal-alert #btn-alert-ok { background-color: var(--primary); color: #fff; box-shadow: none; transition: background-color 0.2s ease; }
  #modal-confirm #btn-confirm-ok:not(.danger):hover, #modal-alert #btn-alert-ok:hover { background-color: var(--primary-600); color: #fff; }

  /* ---- Confirm & alert dialogs: mirror Timewise's Confirm Action popover (seamless header/footer, no row dividers) ---- */
  /* Confirm/alert are blocking prompts, so they must sit above any other modal. All .ts-modal share
     z-index:1000; the day-entry modal is relocated to the end of <body>, so at equal z-index it painted
     over the short-punch confirm and hid it. Lift confirm/alert above the base modal layer. */
  #modal-confirm, #modal-alert { background: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); z-index: 1100; }
  #modal-confirm .ts-modal-content, #modal-alert .ts-modal-content { background: color-mix(in srgb, var(--panel) 82%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: none; border-radius: 12px; max-width: 400px; min-width: min(320px, 92vw); }
  #modal-confirm .ts-modal-header, #modal-alert .ts-modal-header { background: transparent; border: none; padding: 24px 24px 0; }
  #modal-confirm .ts-modal-header h3, #modal-alert .ts-modal-header h3 { font-size: var(--font-size-lg); font-weight: 600; margin: 0; }
  /* Notice/alert + Confirm: leading icon in a soft chip + flex header, so they read as designed dialogs
     rather than bare titles. The same chip system serves both (confirm swaps to a danger tint below). */
  /* Title sits right next to the icon, not pushed to the far right — the base .ts-modal-header uses
     justify-content:space-between (for modals with a close button on the right), which isn't wanted here. */
  #modal-alert .ts-modal-header, #modal-confirm .ts-modal-header { display: flex; align-items: center; justify-content: flex-start; gap: var(--space-3); }
  #modal-alert .ts-alert-icon, #modal-confirm .ts-alert-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--primary-soft-bg); color: var(--primary-soft-text); }
  #modal-alert .ts-alert-icon svg, #modal-confirm .ts-alert-icon svg { width: 18px; height: 18px; }
  /* Destructive confirms: red-tinted icon chip carries the danger (together with the red confirm button) —
     no top edge accent, it was redundant. .is-danger is toggled on the modal/icon by customConfirm(). */
  #modal-confirm .ts-alert-icon.is-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  #modal-confirm .ts-modal-body, #modal-alert .ts-modal-body { padding: 16px 24px 0; }
  #modal-confirm #confirm-message, #modal-alert #alert-message { font-size: 1rem; line-height: 1.5; margin: 0; }
  #modal-confirm .ts-modal-footer, #modal-alert .ts-modal-footer { background: transparent; border: none; padding: 24px 24px 24px; gap: 1rem; }
  /* Match the standard app button (pill, --font-size-sm); just give a min-width so the two dialog
     actions stay balanced. Previously these were oversized vs every other button in the app. */
  #modal-confirm .ts-modal-footer button, #modal-alert .ts-modal-footer button { min-width: 92px; }
  #modal-confirm .ts-modal-close, #modal-alert .ts-modal-close { display: none; }
  /* No focus ring on the confirm/alert buttons (Timewise has none) */
  #modal-confirm button:focus, #modal-confirm button:focus-visible, #modal-alert button:focus, #modal-alert button:focus-visible { outline: none; }
  #modal-confirm #btn-confirm-cancel { background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.15); color: var(--text); box-shadow: none; }
  #modal-confirm #btn-confirm-cancel:hover { background: rgba(0,0,0,0.35); border-color: rgba(255,255,255,0.28); color: var(--text); }
  /* ---- "Welcome back, <name>" editable greeting ---- */
  .ts-welcome { color: var(--text); font-size:20px; white-space:nowrap; }
  #display-name { cursor:pointer; outline:none; display:inline-block; min-width:1ch; font-weight:600; color: var(--text); border-bottom:1px solid transparent; transition: background .2s ease, border-color .2s ease, padding .2s ease; }
  #display-name:focus { padding:0 4px; background: rgba(255,255,255,0.08); border-radius:4px; border-bottom:1px solid var(--primary); }
  #display-name:empty::before { content:"Enter name"; color: var(--primary-soft-text); font-style: italic; }
  @media (max-width: 768px) { .ts-welcome { display:none; } }

  .ts-mobile-defaults { display:flex; align-items:center; gap:8px; }
  .ts-mobile-defaults select { flex:1; }
  /* The mobile view scrolls inside its own container (not the GAS outer frame) so we can control the
     scroll position — e.g. jump back to top after a delete. Shell is pinned to the viewport; the
     container is the scroller. Fixed modals escape overflow:auto, so they stay viewport-anchored. */
  .ts-mobile-shell { height:100vh; height:100dvh; overflow:hidden; background:var(--bg); -webkit-tap-highlight-color:transparent; }
  .ts-mobile-shell .ts-container { max-width:600px; margin:0 auto; padding:0; height:100%; }
  .ts-mobile-shell .ts-mobile-container { width:100%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:max(env(safe-area-inset-top), 6px) 11px calc(24px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  .ts-mobile-date-input { display:none; }

  .ts-m-app { display:flex; flex-direction:column; min-height:100%; }
  .ts-m-card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:13px; }

  .ts-m-appbar { display:flex; align-items:center; gap:11px; padding:14px 4px 16px; }
  /* Brand is a button (taps open the theme picker). Fully reset the global button chrome (bg/shadow/pill)
     and size it to its content — not flex:1 — so the tap target is just the logo+title, not the whole bar. */
  .ts-m-brand { display:flex; align-items:center; gap:11px; flex:0 1 auto; min-width:0; max-width:100%; background:none; border:none; box-shadow:none; border-radius:0; padding:0; margin:0; cursor:pointer; font-family:inherit; text-align:left; -webkit-tap-highlight-color:transparent; }
  .ts-m-brand:hover, .ts-m-brand:active { background:none; background-image:none; box-shadow:none; transform:none; opacity:1; }
  .ts-m-logo { width:38px; height:38px; border-radius:11px; background:var(--primary); color:var(--on-primary, #fff); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ts-m-logo svg { width:21px; height:21px; }
  .ts-m-appbar-title { flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .ts-m-appbar-title h1 { margin:0; font-family:'Marcellus','Optima','Candara','Gill Sans',serif; font-size:24px; font-weight:400; line-height:1; letter-spacing:0.02em; color:var(--text); -webkit-text-stroke:0.4px currentColor; }
  .ts-m-appbar-title p { margin:1px 0 0; font-size:12.5px; color:var(--muted); }
  .ts-m-today { margin-left:auto; background:var(--surface-subtle); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; padding:9px 15px; border-radius:999px; cursor:pointer; min-height:0; }

  .ts-m-datebar { display:flex; align-items:center; gap:10px; padding:8px 10px; }
  .ts-m-chev { width:40px; height:40px; border-radius:11px; background:var(--surface-subtle); border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; padding:0; }
  .ts-m-chev svg { width:20px; height:20px; }
  .ts-m-chev:active { transform:scale(0.94); }
  .ts-m-datemid { flex:1; text-align:center; background:none; border:none; box-shadow:none; border-radius:0; cursor:pointer; padding:4px 0; color:var(--text); display:flex; flex-direction:column; gap:1px; }
  .ts-m-datemid:hover, .ts-m-datemid:active { background:none; background-image:none; box-shadow:none; transform:none; }
  .ts-m-date-main { font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .ts-m-date-sub { font-size:13px; font-weight:700; color:var(--primary-soft-text); text-transform:uppercase; letter-spacing:0.08em; }


  /* Status sits in the header title block, swapping in for the "Quick time entry" subtitle on the same
     line so showing/hiding it never shifts the layout below. */
  .ts-m-status { font-size:12px; line-height:1.3; color:var(--muted); margin:0; }
  .ts-m-status:empty { display:none; }
  .ts-m-status.is-error { color:var(--danger); }
  /* App-bar live clock (next to the brand while a punch is open today): a calm neutral pill + clock + timer,
     matching the desktop on-the-clock pill. JS toggles display none/inline-flex. */
  .ts-m-appbar-clock { display:inline-flex; align-items:center; gap:5px; flex:0 0 auto; background:var(--surface-subtle); border:1px solid var(--border); border-radius:999px; padding:5px 11px; color:var(--text); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1; }
  .ts-m-appbar-clock-ic { display:inline-flex; color:var(--muted); }
  .ts-m-appbar-clock-ic svg { width:13px; height:13px; display:block; }

  .ts-m-seg { display:flex; background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:4px; gap:4px; margin-bottom:13px; }
  .ts-m-seg-btn { flex:1; border:none; background:transparent; color:var(--muted); font-size:15px; font-weight:600; padding:11px 0; border-radius:11px; cursor:pointer; transition:background 0.15s, color 0.15s; }
  .ts-m-seg-btn.active { background:var(--primary); color:var(--on-primary, #fff); }
  /* Locked (the day already has an entry of the other type): dimmed to read as unavailable, but still
     tappable so the tap can explain *why* it's locked instead of silently doing nothing. */
  .ts-m-seg-btn.disabled { opacity:0.4; }

  .ts-m-field { margin-bottom:12px; }
  .ts-m-field:last-child { margin-bottom:0; }
  .ts-m-field label { display:block; font-size:12px; color:var(--muted); margin:0 0 6px 2px; font-weight:700; }
  .ts-m-app select, .ts-m-app input[type="number"] { width:100%; box-sizing:border-box; background:var(--surface-subtle); border:1px solid var(--border); border-radius:11px; color:var(--text); font-size:15px; padding:13px 14px; font-family:inherit; -webkit-appearance:none; appearance:none; }
  .ts-m-app select:focus { outline:none; border-color:var(--primary-soft-border); box-shadow:0 0 0 3px var(--primary-glow); }
  .ts-m-hours-unit { font-size:15px; color:var(--muted); font-weight:600; }
  .ts-m-note { font-size:12px; color:var(--muted); margin:7px 0 0 2px; }

  .ts-m-actions { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .ts-m-actions-secondary { display:flex; gap:10px; }
  .ts-m-actions-secondary:empty { display:none; }
  .ts-m-actions-secondary button { flex:1; }
  .ts-m-primary { width:100%; background:var(--primary); border:none; color:#fff; font-size:16px; font-weight:700; padding:16px; border-radius:13px; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px var(--primary-glow); }
  .ts-m-primary:active { transform:scale(0.99); }
  .ts-m-primary:disabled { opacity:0.5; }
  /* Hero clock: one big primary action. Punch In / Punch Out share the fill (on-theme); the on-the-clock
     state is carried by the status line + a slight darken, not a clashing colour. */
  .ts-m-punchbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:9px; background:var(--primary); border:none; color:#fff; font-size:18px; font-weight:700; padding:18px; border-radius:15px; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px var(--primary-glow); transition:transform .08s ease, filter .15s ease; }
  .ts-m-punchbtn:active { transform:scale(0.99); }
  .ts-m-punchbtn:disabled { opacity:0.5; box-shadow:none; }
  .ts-m-punchbtn.is-out { filter:brightness(0.92); }
  .ts-m-app button.ghost { background:var(--surface-subtle); border:1px solid var(--border); color:var(--text); font-size:14px; font-weight:600; padding:13px; border-radius:13px; cursor:pointer; font-family:inherit; }
  .ts-m-app button.ghost.ts-m-danger { color:var(--danger); }

  .ts-m-list-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 2px 6px; }
  .ts-m-list h3 { font-size:13px; font-weight:600; color:var(--muted); margin:0; }
  .ts-m-list-hint { font-size:12px; font-weight:600; color:var(--muted); opacity:0.75; flex:0 0 auto; }
  /* It's a <button>, so it inherits the global button pill (border-radius:999px) and the primary-fill
     button:hover/:active. Reset to a list row: app-consistent radius + a quiet surface highlight on
     touch/hover, not the loud primary pill. */
  .ts-m-entry { display:flex; align-items:center; gap:12px; width:100%; padding:13px 8px; border:none; border-top:1px solid var(--border); border-radius:12px; background:none; box-shadow:none; cursor:pointer; text-align:left; font-family:inherit; color:var(--text); transition:background .15s ease; }
  .ts-m-entry:first-of-type { border-top:none; }
  .ts-m-entry:hover, .ts-m-entry:active { background:var(--surface-subtle); color:var(--text); box-shadow:none; transform:none; }
  .ts-m-entry-info { flex:1; min-width:0; }
  .ts-m-entry-t { flex:0 0 auto; font-size:17px; font-weight:600; }
  .ts-m-entry-hrs { font-size:17px; font-weight:700; flex:0 0 auto; }
  /* "Open" in the hours slot for an in-progress punch with nothing logged — amber + lighter than the bold
     hour numbers (a bold word reads as shouting), matching the desktop agenda treatment. */
  .ts-m-entry-hrs--open { color:var(--badge-warn-text); font-weight:500; font-size:15px; }
  .ts-m-entry-ic { display:flex; align-items:center; justify-content:center; color:var(--text); flex:0 0 auto; }
  .ts-m-entry-ic svg { width:22px; height:22px; }
  .ts-m-entry-info { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; flex:1; min-width:0; }
  .ts-m-entry-contract { flex:0 1 auto; min-width:0; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Punch entries: a session span (or running badge) on its own line under the title. */
  .ts-m-entry-sub { flex-basis:100%; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ts-m-entry-run { display:inline-flex; align-items:center; gap:6px; color:var(--primary); font-weight:600; }
  /* Open (in-progress) punch entry — amber pill, mirroring the desktop "On the clock" marker. */
  .ts-m-open-badge { display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--warning); background:color-mix(in srgb, var(--warning) 16%, transparent); padding:2px 8px; border-radius:999px; }
  /* On-the-clock status line under the hero Punch button: pulsing dot + start time + live timer. */
  .ts-m-clockstat { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ts-m-clockstat b { color:var(--text); font-weight:600; }
  .ts-m-clock-timer { color:var(--text); font-weight:600; }
  .ts-m-clock-dot { width:8px; height:8px; border-radius:50%; background:var(--primary); flex:0 0 auto; animation:ts-m-pulse 1.4s ease-in-out infinite; }
  @keyframes ts-m-pulse { 0%,100% { opacity:0.35; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .ts-m-clock-dot { animation:none; } }
  /* Punch session editor (bottom sheet reached by tapping a punch entry). */
  .ts-m-sheet-head { margin-bottom:14px; }
  .ts-m-sheet-head h3 { font-size:17px; font-weight:600; margin:0 0 2px; color:var(--text); }
  .ts-m-sess-list { display:flex; flex-direction:column; gap:8px; }
  .ts-m-sess { display:flex; align-items:center; gap:8px; background:var(--surface-subtle); border:1px solid var(--border); border-radius:12px; padding:8px 10px; }
  /* min-width keeps an empty (no value) native time input from collapsing to a tiny pill on iOS, so both
     the start and (unset) end read as equal, tappable fields. text-align centres the value like the start. */
  /* Empty native time inputs collapse on iOS, which IGNORES min-width/min-height on them — so flex:1 1 0 +
     min-width made the empty "out" field a thin sliver. Fix with DEFINITE sizes the native control honours:
     flex-basis for width, an explicit height for the cross axis (min-height alone wasn't enough on-device). */
  /* display:flex + center is the reliable iOS fix for the value sitting top-aligned in a fixed-height native
     time input (padding/line-height alone don't centre the ::-webkit-date-and-time-value). */
  .ts-m-sess-time { flex:1 1 96px; min-width:96px; height:48px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:18px; font-weight:600; padding:0 10px; font-family:inherit; -webkit-appearance:none; appearance:none; }
  .ts-m-sess-time::-webkit-date-and-time-value { margin:0; }
  .ts-m-sess-arrow { flex:0 0 auto; color:var(--muted); }
  .ts-m-sess-x { flex:0 0 auto; background:none; border:none; color:var(--muted); font-size:22px; line-height:1; padding:4px 8px; cursor:pointer; }
  .ts-m-addsess { width:100%; margin-top:10px; background:transparent; border:1px dashed var(--border); color:var(--primary); border-radius:12px; padding:12px; min-height:44px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .ts-m-addsess:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .ts-m-sess-hint { margin:10px 2px 0; }
  .ts-m-sheet-actions { display:flex; gap:10px; margin-top:16px; }
  .ts-m-sheet-actions .ts-m-primary, .ts-m-sheet-actions .ghost { flex:1; }
  /* Theme picker list (tap the brand). Plain bordered rows; the active one in primary with a tick. */
  /* Clean divider list — fully reset the global button chrome (radius/shadow/transform) that was leaking
     through as the "weird boxes" around each theme, leaving a flat list with hairline separators. */
  .ts-m-theme-list { display:flex; flex-direction:column; }
  .ts-m-theme-row { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:none; border:none; border-radius:0; box-shadow:none; transform:none; border-bottom:1px solid var(--border); padding:15px 4px; font-size:16px; color:var(--text); font-family:inherit; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; transition:background .12s ease; }
  .ts-m-theme-row:last-child { border-bottom:none; }
  .ts-m-theme-row:hover, .ts-m-theme-row:active { background:var(--surface-subtle); }
  .ts-m-theme-row.is-active { color:var(--primary); font-weight:600; }
  .ts-m-theme-tick { color:var(--primary); font-weight:700; flex:0 0 auto; }
  /* Quiet day total at the foot of the entries card (only ever visible once entries exist). */
  .ts-m-day-total { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:12px; padding-top:13px; border-top:1px solid var(--border); }
  .ts-m-day-total > span:first-child { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
  .ts-m-day-total > span:last-child { font-size:20px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }

  /* Empty-day tumbleweed (only shown when the day has no entries). Animation as found; image inlined to
     drop the jQuery dependency; ground + pebbles use theme colours so they read on any theme. */
  /* Drop the desert scene down into the container's decorative bottom padding so the ground sits closer to
     the screen edge. translateY (not margin) keeps it purely visual — no layout/scroll shift — and trims
     the 24px padding to ~8px while leaving the safe-area inset, so the ground never tucks under the home indicator. */
  .ts-m-empty { margin-top:auto; padding:0; transform:translateY(20px); }
  .ts-m-tw { position:relative; display:block; height:200px; width:100%; border-bottom:2px solid color-mix(in srgb, var(--muted) 50%, transparent); overflow:hidden; }

  @keyframes ts-tw-bounce { 0%,10% { bottom:50%; } 100% { bottom:0%; } }
  @keyframes ts-tw-spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
  .ts-m-tw-peb1 { position:absolute; top:95%; background-color:var(--muted); width:10px; height:10px; border-radius:20px 20px 0 0; animation: ts-tw-peb 1s linear infinite; }
  .ts-m-tw-peb2 { position:absolute; top:97%; background-color:var(--muted); width:5px; height:5px; border-radius:10px 10px 0 0; animation: ts-tw-peb 2s linear infinite; }
  .ts-m-tw-peb3 { position:absolute; top:98%; background-color:var(--muted); width:3px; height:3px; border-radius:20px 20px 0 0; animation: ts-tw-peb 3s linear infinite; }
  @keyframes ts-tw-peb { 0% { right:-20%; } 100% { right:110%; } }
  /* Background cactus cluster: faint + slow, drifts across behind the tumbleweed then waits off-screen
     (the dwell at the end gives a gap so it passes occasionally, not on a constant conveyor). */
  .ts-m-tw-cacti { position:absolute; bottom:0; left:0; height:72px; opacity:0.3; color:var(--muted); animation: ts-tw-cactus 26s linear infinite; }
  .ts-m-tw-cacti svg { display:block; height:100%; width:auto; }
  @keyframes ts-tw-cactus { 0% { transform:translateX(calc(100vw + 40px)); } 58%,100% { transform:translateX(-120px); } }
  /* A nearer solo cactus: bigger, a touch bolder, faster, on a different cycle — so it overtakes the far
     cluster as it passes, which is what gives the scene real depth. */
  /* Opaque (was 0.42) so the nearest cactus actually OCCLUDES the faint far cluster as it overtakes it,
     instead of the back one showing through. Depth now reads as front-solid over back-faint. */
  .ts-m-tw-cactus-solo { position:absolute; bottom:0; left:0; height:92px; opacity:1; color:var(--muted); animation: ts-tw-cactus-solo 16s linear infinite; }
  .ts-m-tw-cactus-solo svg { display:block; height:100%; width:auto; }
  @keyframes ts-tw-cactus-solo { 0% { transform:translateX(calc(100vw + 30px)); } 46%,100% { transform:translateX(-90px); } }
  @media (prefers-reduced-motion: reduce) { .ts-m-tw-bounce, .ts-m-tw-peb1, .ts-m-tw-peb2, .ts-m-tw-peb3, .ts-m-tw-cacti, .ts-m-tw-cactus-solo, .ts-m-tw-star { animation:none; } .ts-m-tw-bounce { bottom:0; } .ts-m-tw-cacti { transform:translateX(8%); } .ts-m-tw-cactus-solo { transform:translateX(70%); } }
  /* Dark themes: the brown tumbleweed PNG vanishes on a dark ground. brightness(0)+invert flips it to a light
     silhouette (sepia warms it slightly so it reads as straw, not stark white). */
  .ts-theme--dark .ts-m-tw-bounce { filter:brightness(0) invert(0.92) sepia(0.35) saturate(1.4); }
  /* Night sky (dark themes only): a soft moon + a few twinkling stars over the desert. Light themes = daytime. */
  .ts-m-tw-night { display:none; }
  .ts-theme--dark .ts-m-tw-night { display:block; }
  .ts-m-tw-moon { position:absolute; top:22px; right:24px; width:22px; height:22px; border-radius:50%; background:#efe7c8; box-shadow:0 0 10px 2px color-mix(in srgb, #efe7c8 35%, transparent); }
  .ts-m-tw-star { position:absolute; width:3px; height:3px; border-radius:50%; background:#efe7c8; opacity:0.85; animation:ts-tw-twinkle 2.4s ease-in-out infinite; }
  .ts-m-tw-star1 { top:26px; left:14%; }
  .ts-m-tw-star2 { top:54px; left:30%; width:2px; height:2px; animation-delay:0.8s; }
  .ts-m-tw-star3 { top:18px; left:48%; animation-delay:1.4s; }
  .ts-m-tw-star4 { top:64px; left:72%; width:2px; height:2px; animation-delay:0.4s; }
  .ts-m-tw-star5 { top:40px; left:86%; animation-delay:1.1s; }
  .ts-m-tw-star6 { top:92px; left:20%; width:2px; height:2px; animation-delay:1.8s; }
  .ts-m-tw-star7 { top:78px; left:54%; animation-delay:0.2s; }
  .ts-m-tw-star8 { top:104px; left:40%; width:2px; height:2px; animation-delay:2.0s; }
  @keyframes ts-tw-twinkle { 0%,100% { opacity:0.85; } 50% { opacity:0.3; } }
  .ts-m-entry-gt { color:var(--muted); flex:0 0 auto; display:flex; }
  .ts-m-entry-gt svg { width:18px; height:18px; }

  /* Swipe-to-delete: each row is a foreground button over a red delete action. Short swipe reveals
     the button; a full swipe deletes (handled in JS). The foreground is opaque so it hides the action. */
  .ts-m-swipe { position:relative; overflow:hidden; border-top:1px solid var(--border); }
  .ts-m-swipe:first-of-type { border-top:none; }
  /* Full-width red beneath the row so a swipe reveals a growing red strip (not a fixed square with a
     gap behind it). The Delete label is pinned to the right so it shows from the first bit of swipe. */
  .ts-m-swipe-action { position:absolute; inset:0; width:100%; display:flex; align-items:center; justify-content:flex-end; padding-right:26px; background:var(--danger); color:#fff; font-size:14px; font-weight:700; border:none; cursor:pointer; font-family:inherit; box-shadow:none; border-radius:12px; opacity:0; }
  .ts-m-swipe-action:hover { background:var(--danger); box-shadow:none; }
  /* Only reveal the red while a row is actually being swiped/open/removing — otherwise a compositing
     seam can flash a sliver of red behind the row during scroll. */
  .ts-m-swipe.armed .ts-m-swipe-action,
  .ts-m-swipe.open .ts-m-swipe-action,
  .ts-m-swipe.removing .ts-m-swipe-action { opacity:1; }
  .ts-m-swipe .ts-m-entry { position:relative; z-index:1; background:var(--panel); border-top:none; will-change:transform; touch-action:pan-y; }
  .ts-m-swipe .ts-m-entry.snap { transition:transform .2s ease; }
  /* Exit animation on delete: row slides off and collapses its height so the list closes the gap. */
  .ts-m-swipe.removing { transition:height .22s ease, opacity .22s ease; opacity:0; border-top-color:transparent; }

  .ts-m-footer { margin-top:6px; }
  .ts-view-switch { display:flex; justify-content:center; }
  .ts-m-desk-q { font-size:13px; color:var(--muted); padding:8px; }
  .ts-m-desk { color:var(--primary-soft-text); text-decoration:none; font-weight:600; }

  .ts-m-app #mobile-punch-summary { font-size:15px; font-weight:600; color:var(--text); margin-top:6px; }
  .ts-mobile-shell .ts-punch-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .ts-mobile-shell .ts-punch-row .ts-punch-input { flex:1; min-width:110px; background:var(--surface-subtle); border:1px solid var(--border); border-radius:11px; color:var(--text); font-size:15px; padding:11px; font-family:inherit; }
  .ts-mobile-shell .ts-punch-row button.ghost { padding:11px 14px; font-size:13px; }

  .ts-modal--mobile-date .ts-modal-content { width:92vw; max-width:420px; }
  .ts-modal--mobile-date .ts-modal-body { display:flex; flex-direction:column; gap:14px; }

  /* Quick entry: header pill + bottom sheet surfacing the user's existing hour-type quick actions. */
  /* Quick entry + hours keypad render as bottom sheets: flush to the bottom edge, rounded top only, in
     the thumb zone (overrides the base .ts-modal centering). */
  .ts-modal.ts-modal--mobile-sheet { align-items:flex-end; padding:0; }
  .ts-modal--mobile-sheet .ts-modal-content { width:100%; max-width:560px; max-height:85dvh; border-radius:20px 20px 0 0; border-bottom:none; animation:tsSheetUp .22s cubic-bezier(.22,.9,.25,1); }
  .ts-modal--mobile-sheet .ts-modal-body { padding:22px 16px calc(24px + env(safe-area-inset-bottom)); }
  @keyframes tsSheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .ts-m-qa-list { display:flex; flex-direction:column; gap:11px; }
  .ts-m-qa { display:flex; align-items:center; gap:15px; width:100%; padding:19px 18px; border:1px solid var(--border); border-radius:15px; background:var(--surface-subtle); cursor:pointer; text-align:left; font-family:inherit; color:var(--text); box-shadow:none; }
  .ts-m-qa:hover { background:var(--surface-subtle); color:var(--text); box-shadow:none; }
  .ts-m-qa:active { transform:scale(0.99); }
  .ts-m-qa-ic { display:flex; align-items:center; justify-content:center; color:var(--text); flex:0 0 auto; }
  .ts-m-qa-ic svg { width:24px; height:24px; }
  .ts-m-qa-info { flex:1; min-width:0; }
  .ts-m-qa-name { font-size:17px; font-weight:600; }
  .ts-m-qa-hrs { font-size:17px; font-weight:700; color:var(--primary-soft-text); flex:0 0 auto; }
  .ts-m-qa-sub { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  /* Section labels — only rendered when the sheet mixes quick-fill types and day templates. */
  .ts-m-qa-sec { font-size:12px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); margin:6px 2px -3px; }
  .ts-m-qa-sec:first-child { margin-top:0; }
  .ts-m-qa-empty { font-size:13px; color:var(--muted); margin:0; }

  /* Side-by-side Hour type + Contract; a hidden hour-type column lets Contract flex to full width. */
  .ts-m-field-row { display:flex; gap:8px; margin-bottom:12px; }
  .ts-m-field-row .ts-m-field { flex:1; min-width:0; margin-bottom:0; }
  /* Prominent quick-log trigger (the hero one-tap path) that opens the presets sheet. */
  /* Sits between the entry panels and the entries list (moved out of the Basic panel so it shows on both
     tabs) — bottom margin keeps the card rhythm; the panel above supplies the top gap. */
  .ts-m-quicklog { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--primary); border:none; color:#fff; font-size:16px; font-weight:700; padding:15px; border-radius:13px; cursor:pointer; font-family:inherit; margin:0 0 13px; box-shadow:0 6px 18px var(--primary-glow); }
  .ts-m-quicklog[hidden] { display:none; }
  .ts-m-quicklog:active { transform:scale(0.99); }
  .ts-m-quicklog svg { width:18px; height:18px; }
  /* Hours field is a tappable display that opens the in-app keypad — no native keyboard, no viewport jump. */
  .ts-m-hours-display { display:flex; align-items:baseline; gap:8px; width:100%; background:var(--surface-subtle); border:1px solid var(--border); border-radius:11px; padding:11px 14px; cursor:pointer; font-family:inherit; text-align:left; }
  .ts-m-hours-display:active { transform:scale(0.997); }

  /* Monochrome: drop the per-category colour tint so every active chip shares one uniform neutral highlight
     (colours collapse to different greys otherwise, making identical states look mismatched). The coloured
     dot still carries the category identity. Colour themes keep the tinted fill above. */
  .ts-theme-monochrome .ts-calendar-filter-item.active { background: color-mix(in srgb, var(--text) 15%, transparent); }
  .ts-theme-monochrome .ts-calendar-filter-item.active:hover { background: color-mix(in srgb, var(--text) 20%, transparent); }
  .ts-calendar-filter-checkbox { width:14px; height:14px; }
  .ts-calendar-filter-color { width:8px; height:8px; border-radius:50%; border:none; flex:0 0 auto; }
  .ts-calendar-filter-name { font-size:13px; font-weight:500; }
  /* Calendar hour-type filter chips use the unified .ts-calendar-filter-item design (single source). */
  /* Chips and the All/None/Income presets share one row so they read as a single control */
  .ts-calendar-filter-row { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .ts-calendar-filter-presets { display:flex; align-items:center; gap:2px; }
  .ts-calendar-filter-presets-divider { width:1px; align-self:stretch; background:var(--border); margin:2px 8px; }
  .ts-calendar-filter-presets button { font-size:12px; padding:4px 10px; background:transparent; color:var(--muted); box-shadow:none; }
  .ts-calendar-filter-presets button:hover { background:var(--hover-bg); color:var(--text); }
  /* Buttons that open a picker skip the press animation — the modal appearing is the feedback */
  #calendar-jump:active, #mobile-date-label:active { transform:none; }
  @media (max-width: 720px){ .ts-col { min-width:100%; } .ts-modal-content { width:95%; max-width:none; } }
  @keyframes calendarSelect {
    0% {
      transform: scale(0.98);
      box-shadow: 0 0 0 0 var(--calendar-selected-border, var(--primary)), 0 0 0 0 var(--calendar-selected-glow, rgba(37, 99, 235, 0.25)), 0 0 0 0 rgba(15, 23, 42, 0.25);
    }
    55% {
      transform: scale(1.02);
      box-shadow: 0 0 0 1.4px var(--calendar-selected-border, var(--primary)), 0 0 0 5px var(--calendar-selected-glow, rgba(37, 99, 235, 0.25)), 0 12px 22px -12px rgba(15, 23, 42, 0.4);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 0 0 1px var(--calendar-selected-border, var(--primary)), 0 0 0 4px var(--calendar-selected-glow, rgba(37, 99, 235, 0.25)), 0 10px 18px -10px rgba(15, 23, 42, 0.35);
    }
  }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .ts-annual-stat-card { animation: fadeInUp 0.4s ease-out; opacity:0; animation-fill-mode: forwards; }
  .ts-annual-stat-card:nth-child(1) { animation-delay: 0.05s; }
  .ts-annual-stat-card:nth-child(2) { animation-delay: 0.1s; }
  .ts-annual-stat-card:nth-child(3) { animation-delay: 0.15s; }
  .ts-annual-stat-card:nth-child(4) { animation-delay: 0.2s; }
  .ts-annual-stat-card:nth-child(5) { animation-delay: 0.25s; }
  .ts-annual-stat-card:nth-child(6) { animation-delay: 0.3s; }
  .ts-annual-stat-card:nth-child(7) { animation-delay: 0.35s; }
  .ts-annual-stat-card:nth-child(8) { animation-delay: 0.4s; }

  /* ---- Polish pass: tabular numerals, disclosure chevrons, empty-state icons, modal motion ---- */
  /* Fixed-width digit forms so values align and don't shift as they update */
  .ts-stat-card-value, .ts-stat-card-subtext, .ts-calendar-total, .ts-calendar-day,
  .ts-income-row-est, .ts-income-row-actual, .ts-expected-aggregate, .ts-expected-lines,
  .ts-hour-type-breakdown-value, .ts-table td, .ts-payroll-table td, .ts-myob-table td,
  .contract-detail-value, .contract-burndown-table td, .contract-hours-breakdown-card .value,
  .ts-total-row, .ts-month-picker-year,
  .ts-deduction-meta, #calendar-label { font-variant-numeric: tabular-nums; }
  /* Collapse/expand chevron: single right-pointing SVG rotated when open (replaces ▶/▼ glyphs) */
  .ts-disclosure-arrow { display:inline-flex; align-items:center; justify-content:center; transition: transform .2s ease; color: var(--muted); }
  .ts-disclosure-arrow svg { width:14px; height:14px; }
  .ts-disclosure-arrow.is-open { transform: rotate(90deg); }
  /* Empty-state icons are SVG line icons now, not emoji */
  .ts-empty-state__icon { color: var(--muted); display:flex; align-items:center; justify-content:center; }
  .ts-empty-state__icon svg { width:36px; height:36px; }
  .ts-empty-state--inline .ts-empty-state__icon svg { width:26px; height:26px; }
  .ts-mobile-shell button svg { width:20px; height:20px; }
  @keyframes tsModalFade { from { opacity:0; } to { opacity:1; } }
  @keyframes tsModalIn { from { opacity:0; transform: translateY(10px) scale(0.97); } to { opacity:1; transform: none; } }
  /* Exit animation — mirrors the open so closing has the same polish (driven by hideModal adding .ts-modal--closing). */
  .ts-modal.ts-modal--closing { animation: tsModalFadeOut .16s ease-in forwards; }
  .ts-modal.ts-modal--closing .ts-modal-content { animation: tsModalOut .17s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes tsModalFadeOut { from { opacity:1; } to { opacity:0; } }
  @keyframes tsModalOut { from { opacity:1; transform: none; } to { opacity:0; transform: translateY(8px) scale(0.97); } }
  @media (prefers-reduced-motion: reduce) { .ts-modal.ts-modal--closing, .ts-modal.ts-modal--closing .ts-modal-content { animation:none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
    /* Loading spinners are status indicators, not decoration — they must keep spinning so "working" reads
       as working (otherwise the universal rule above freezes them into a stuck circle). */
    .ts-toast-spinner, .ts-pill-spinner, .ts-spinner, #page-public-holidays .ph-loading svg, .tsmr-spinner { animation-duration:0.7s !important; animation-iteration-count:infinite !important; }
  }

  /* ============================================================
     ANNUAL VIEWS — redesigned components (ts-av-*)
     ============================================================ */
  .ts-av-section { margin-bottom:var(--space-5); }
  .ts-av-panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:var(--space-5); box-shadow:var(--shadow-md); }
  .ts-av-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-4); flex-wrap:wrap; }
  .ts-av-title h4 { margin:0; font-size:var(--font-size-lg); font-weight:600; letter-spacing:-0.008em; }
  .ts-av-legend { display:flex; gap:var(--space-4); align-items:center; flex-wrap:wrap; }
  .ts-av-legend span { display:inline-flex; align-items:center; gap:7px; font-size:var(--font-size-xs); color:var(--muted); }
  .ts-av-dot { width:9px; height:9px; border-radius:3px; display:inline-block; }

  .ts-av-seg { position:relative; display:inline-flex; background:var(--surface-subtle); border-radius:10px; padding:3px; gap:2px; }
  /* Period selector: segment + year dropdown share ONE track so they read as a single control. The seg keeps
     its own padding/slider (untouched); only its bg goes transparent so the group track shows through. The
     year button already uses --surface-subtle, so it sits flush. The divider (inside #av-year-control) hides
     with the year when "All time" is active, collapsing the group back to a plain segment. */
  .ts-av-period-group { display:inline-flex; align-items:center; background:var(--surface-subtle); border-radius:10px; }
  .ts-av-period-group .ts-av-seg { background:transparent; }
  .ts-av-period-div { flex:0 0 auto; width:1px; height:20px; margin:0 2px; background:color-mix(in srgb, var(--text) 14%, transparent); }
  .ts-av-period-group .ts-select__button { background:transparent; border-color:transparent; }
  .ts-av-period-group .ts-select__button:hover,
  .ts-av-period-group .ts-select.is-open .ts-select__button { background:transparent; border-color:transparent; color:var(--text); }
  /* The moving pill (.ts-av-seg__slider) is injected once per control and positioned in JS over the
     selected button, so it slides between options instead of the background snapping in place. */
  /* Neutral pill: a muted-white outline (no fill colour) marks the selection without any accent tint
     pulling the eye away from the data. The brighter selected label does the rest of the work. */
  /* Selected pill = a raised tile. Fill is panel lifted toward --text so it reads LIGHTER than the
     --surface-subtle track in BOTH themes (plain --panel is darker than the track in dark mode, so the pill
     sank instead of lifting). Border + shadow define the edge regardless of fill contrast. */
  .ts-av-seg__slider { position:absolute; top:3px; bottom:3px; left:0; width:0; box-sizing:border-box; background:color-mix(in srgb, var(--text) 8%, var(--panel)); border:1px solid color-mix(in srgb, var(--text) 18%, transparent); border-radius:7px; box-shadow:var(--shadow-md); z-index:0; opacity:0; pointer-events:none; }
  .ts-av-seg__slider.is-ready { transition: transform .55s cubic-bezier(.22,.9,.25,1), width .55s cubic-bezier(.22,.9,.25,1), opacity .2s ease; }
  .ts-av-seg button { position:relative; z-index:1; border:none; background:none; color:var(--muted); font-weight:600; font-size:var(--font-size-xs); padding:6px 14px; border-radius:7px; cursor:pointer; transition:color .18s ease, transform .12s ease, background .18s ease; }
  /* Hover just brightens the label so the pill stays the only filled element in the control. */
  .ts-av-seg button:not([aria-selected="true"]):hover { color:var(--text); }
  .ts-av-seg button:active { transform:scale(.96); }
  .ts-av-seg button[aria-selected="true"] { color:var(--text); }
  .ts-av-seg button:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
  /* Hour-type quick-action toggle reuses the Annual View segment look, but with a STATIC raised pill on the
     selected button (a simple 2-option modal control doesn't need the JS-positioned sliding pill). */
  #hour-type-quick-mode button[aria-selected="true"] { background:color-mix(in srgb, var(--text) 8%, var(--panel)); border:1px solid color-mix(in srgb, var(--text) 18%, transparent); box-shadow:var(--shadow-md); }

  /* KPI cards */
  .ts-av-kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); margin-bottom:var(--space-4); }
  @media (max-width:1080px){ .ts-av-kpi-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .ts-av-kpi-grid{ grid-template-columns:1fr;} }
  .ts-av-kpi { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:var(--space-4) var(--space-4) var(--space-2); box-shadow:var(--shadow-md); overflow:hidden; transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; animation:tsAvFadeUp .45s ease-out backwards; }
  .ts-av-kpi:hover { border-color:color-mix(in srgb,var(--text) 16%, var(--border)); }
  .ts-av-kpi.ts-av-noanim { animation:none; }
  .ts-av-kpi:nth-child(1){animation-delay:.04s} .ts-av-kpi:nth-child(2){animation-delay:.09s} .ts-av-kpi:nth-child(3){animation-delay:.14s} .ts-av-kpi:nth-child(4){animation-delay:.19s}
  .ts-av-kpi-label { font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); font-weight:600; }
  .ts-av-kpi-value { font-size:var(--font-size-xxl); font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-top:6px; font-variant-numeric:tabular-nums; }
  .ts-av-kpi-foot { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-3); margin-top:var(--space-2); }
  .ts-av-trend { display:inline-flex; align-items:center; gap:4px; font-size:var(--font-size-xs); font-weight:700; padding:2px 8px; border-radius:999px; }
  .ts-av-trend.up { background:var(--badge-success-bg); color:var(--badge-success-text); }
  .ts-av-trend.down { background:var(--badge-error-bg); color:var(--badge-error-text); }
  .ts-av-trend.flat { background:var(--surface-subtle); color:var(--muted); }
  .ts-av-trend .ctx { color:var(--muted); font-weight:500; margin-left:2px; }

  /* secondary metric chips */
  .ts-av-metric-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); margin-bottom:var(--space-5); }
  @media (max-width:1080px){ .ts-av-metric-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .ts-av-metric-grid{ grid-template-columns:1fr;} }
  .ts-av-metric { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:var(--space-3) var(--space-4); box-shadow:var(--shadow-md); transition:border-color .2s ease; }
  .ts-av-metric:hover { border-color:color-mix(in srgb,var(--text) 14%, var(--border)); }
  .ts-av-metric .l { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600; }
  .ts-av-metric .v { font-size:var(--font-size-lg); font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .ts-av-metric .s { font-size:11px; color:var(--muted); margin-top:2px; }

  .ts-av-hero-chart { height:340px; position:relative; }

  /* two-column */
  /* Default: columns sit at their natural heights (fine for a single financial/calendar year, where the
     Monthly Breakdown is often SHORTER than the side column). */
  .ts-av-two-col { display:grid; grid-template-columns:1.7fr 1fr; gap:var(--space-4); align-items:start; }
  /* .is-clamp (added by JS only for long lists, e.g. All time / >12 months): the side (Insights/Hours/
     Contracts) rail drives the height, and the Monthly Breakdown clamps to it (its panel is taken out of the
     height calc) and scrolls its rows internally — so the two columns end level and auto-track. No JS measuring. */
  .ts-av-two-col.is-clamp { align-items:stretch; }
  .ts-av-two-col.is-clamp #av-breakdown-rail { position:relative; min-height:360px; }
  .ts-av-two-col.is-clamp #av-breakdown-rail > .ts-av-panel { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; }
  .ts-av-two-col.is-clamp #av-breakdown-rail .ts-av-table-scroll { flex:1 1 auto; min-height:0; overflow:auto; }
  .ts-av-two-col.is-clamp #av-breakdown-rail #av-month-table thead th { position:sticky; top:0; z-index:2; background:var(--panel); }
  .ts-av-two-col.is-clamp #av-breakdown-rail #av-month-table tfoot td { position:sticky; bottom:0; z-index:2; background:var(--panel); box-shadow:0 -1px 0 var(--border); }
  @media (max-width:1080px){
    .ts-av-two-col{ grid-template-columns:1fr; }
    /* Stacked: drop the clamp so the table flows at its natural height. */
    .ts-av-two-col.is-clamp{ align-items:start; }
    .ts-av-two-col.is-clamp #av-breakdown-rail{ position:static; min-height:0; }
    .ts-av-two-col.is-clamp #av-breakdown-rail > .ts-av-panel{ position:static; display:block; overflow:visible; }
    .ts-av-two-col.is-clamp #av-breakdown-rail .ts-av-table-scroll{ overflow-x:auto; overflow-y:visible; }
    .ts-av-two-col.is-clamp #av-breakdown-rail #av-month-table thead th,
    .ts-av-two-col.is-clamp #av-breakdown-rail #av-month-table tfoot td { position:static; }
  }

  /* monthly table */
  .ts-av-table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  .ts-av-table th, .ts-av-table td { padding:11px 10px; text-align:right; font-size:var(--font-size-sm); border-bottom:1px solid var(--border); white-space:nowrap; }
  .ts-av-table th:first-child, .ts-av-table td:first-child { text-align:left; }
  .ts-av-table thead th { color:var(--muted); font-weight:600; font-size:var(--font-size-xs); text-transform:uppercase; letter-spacing:0.04em; cursor:pointer; user-select:none; transition:color .15s ease; }
  .ts-av-table thead th:hover { color:var(--text); }
  .ts-av-table thead th:focus-visible { outline:2px solid var(--focus-ring); outline-offset:-2px; }
  /* Hidden arrow uses display:none (not opacity:0) so it reserves no width — otherwise the
     invisible glyph pushes every header's text left of its right-aligned values. Only the
     sorted column shows it. */
  .ts-av-table thead th .arrow { display:none; margin-left:4px; font-size:10px; }
  .ts-av-table thead th[aria-sort="ascending"] .arrow { display:inline-block; transform:rotate(180deg); }
  .ts-av-table thead th[aria-sort="descending"] .arrow { display:inline-block; }
  .ts-av-table tbody tr { transition:background .14s ease; }
  .ts-av-table tbody tr:hover { background:var(--hover-bg); }
  .ts-av-table tbody tr:hover .ts-av-row-act { opacity:1; transform:translateX(0); }
  .ts-av-state-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:middle; }
  .ts-av-state-dot.actual { background:var(--success); box-shadow:0 0 0 3px var(--badge-success-bg); }
  .ts-av-state-dot.proj { background:transparent; border:1.5px solid var(--warning); }
  .ts-av-row-act { opacity:0; transform:translateX(-4px); transition:opacity .15s ease, transform .15s ease; background:none; border:none; color:var(--primary-soft-text); cursor:pointer; padding:4px; border-radius:6px; display:inline-grid; place-items:center; }
  .ts-av-row-act:hover { background:var(--primary-soft-bg); }
  .ts-av-row-act:focus-visible { outline:2px solid var(--focus-ring); outline-offset:1px; opacity:1; }
  .ts-av-table tfoot td { padding:12px 10px; font-weight:700; border-top:2px solid var(--border); border-bottom:none; }
  /* Static (non-sortable) variant — used by Income Breakdown. Headers aren't interactive. */
  .ts-av-table--static thead th { cursor:default; }
  .ts-av-table--static thead th:hover { color:var(--muted); }
  .ts-av-table--static tbody tr:hover { background:transparent; }
  .ts-av-table--static .ts-av-cat { display:inline-flex; align-items:center; gap:8px; }
  .ts-av-table--static tr.is-total td { font-weight:700; border-top:1px solid var(--border); }
  /* Inline magnitude bar — used in the Income Breakdown table where it encodes a labelled % of gross. */
  .ts-av-mini-bar { height:5px; border-radius:3px; background:var(--border); overflow:hidden; min-width:54px; display:inline-block; vertical-align:middle; margin-left:6px; }
  .ts-av-mini-bar > span { display:block; height:100%; background:var(--chart-net); border-radius:3px; }

  /* insights feed */
  .ts-av-feed { display:flex; flex-direction:column; gap:var(--space-3); }
  .ts-av-feed-item { display:flex; gap:var(--space-3); padding:var(--space-3); border-radius:12px; background:var(--surface-subtle); border:1px solid transparent; transition:border-color .18s ease, transform .18s ease; }
  .ts-av-feed-item:hover { border-color:var(--border); transform:translateX(2px); }
  .ts-av-feed-ic { flex:0 0 34px; width:34px; height:34px; border-radius:9px; display:grid; place-items:center; }
  .ts-av-feed-ic svg { width:17px; height:17px; }
  .ts-av-feed-ic.ok { background:var(--badge-success-bg); color:var(--badge-success-text); }
  .ts-av-feed-ic.warn { background:var(--badge-warn-bg); color:var(--badge-warn-text); }
  .ts-av-feed-ic.err { background:var(--badge-error-bg); color:var(--badge-error-text); }
  .ts-av-feed-ic.info { background:var(--primary-soft-bg); color:var(--primary-soft-text); }
  .ts-av-feed-title { font-size:var(--font-size-sm); font-weight:600; margin:0 0 2px; }
  .ts-av-feed-text { font-size:var(--font-size-xs); color:var(--muted); margin:0; line-height:1.45; }

  /* allocation bar */
  /* Slim allocation strip: a quick proportional topper over the breakdown table (which carries the
     names + figures), rather than a full-height labelled wall. */
  .ts-av-alloc-bar { display:flex; height:16px; border-radius:8px; overflow:hidden; gap:3px; margin:var(--space-2) 0 var(--space-4); }
  .ts-av-alloc-seg { height:100%; border-radius:5px; min-width:3px; transition:flex-grow .9s cubic-bezier(.22,1,.36,1), filter .18s ease; }
  .ts-av-alloc-seg:hover { filter:brightness(1.12); }
  .ts-av-alloc-note { font-size:var(--font-size-sm); color:var(--muted); background:var(--surface-subtle); border:1px solid var(--border); border-radius:10px; padding:var(--space-3); margin-bottom:var(--space-2); line-height:1.5; }
  .ts-av-alloc-legend { display:flex; flex-direction:column; gap:var(--space-2); }
  .ts-av-alloc-row { display:flex; align-items:center; gap:var(--space-3); font-size:var(--font-size-sm); }
  .ts-av-alloc-row .sw { width:11px; height:11px; border-radius:4px; flex:0 0 auto; }
  .ts-av-alloc-row .nm { flex:1; color:var(--text); }
  .ts-av-alloc-row .amt { font-variant-numeric:tabular-nums; font-weight:600; }
  .ts-av-alloc-row .pct { color:var(--muted); width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  .ts-av-alloc-supernote { display:flex; align-items:center; gap:var(--space-2); margin-top:var(--space-3); font-size:var(--font-size-sm); color:var(--muted); font-variant-numeric:tabular-nums; }
  .ts-av-alloc-supernote:empty { display:none; }
  .ts-av-alloc-supernote .sw { width:11px; height:11px; border-radius:4px; flex:0 0 auto; }
  .ts-av-alloc-supernote .pct { color:var(--muted); }

  /* hours by type — ranked bars */
  .ts-av-hours { display:flex; flex-direction:column; gap:var(--space-4); padding-top:var(--space-2); }
  .ts-av-hrow-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; font-size:var(--font-size-sm); }
  .ts-av-hrow-name { display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--text); }
  .ts-av-hrow-name .dot { width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
